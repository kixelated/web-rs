[package]
name = "web-async"
description = "Async helpers and utilities for WASM"
authors = ["Luke Curley"]
repository = "https://github.com/kixelated/web-rs"
license = "MIT OR Apache-2.0"

version = "0.1.5"
edition = "2021"

keywords = ["wasm", "async", "futures"]
categories = ["wasm"]

[features]
tracing = ["dep:tracing"]

[dependencies]
tracing = { version = "0.1", optional = true }

[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dependencies]
wasm-bindgen-futures = "0.4"
# Browser time shim: std::time::Instant + tokio::time API on performance.now() + setTimeout.
wasmtimer = { version = "0.4", default-features = false, features = ["tokio"] }

[target.'cfg(any(not(target_arch = "wasm32"), target_os = "wasi"))'.dependencies]
tokio = { version = "1", features = ["rt", "time"] }
